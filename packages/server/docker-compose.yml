# Local dev stack: Postgres + portal server + one example subscription pod.
# Subscription pods are normally provisioned dynamically by the portal admin
# (one pod per Claude subscription); the `sub-pod-1` service below exists so
# Phase 2 / Phase 3 can be smoke-tested end-to-end on a laptop without K8s.
#
# The portal-server mounts /var/run/docker.sock so it can `docker exec`
# into pods to run `claude setup-token` interactively over the admin WS.

services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:-portal}@postgres:5432/portal
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      WORKSPACE_ROOT: /workspaces
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"
    volumes:
      # Bind your local workspaces dir into the container so created projects exist on disk.
      # Override with WORKSPACES_HOST_DIR=/path/on/your/mac.
      - ${WORKSPACES_HOST_DIR:-./.workspaces}:/workspaces
      # Docker socket so the portal can exec into subscription pods for `claude setup-token`.
      - /var/run/docker.sock:/var/run/docker.sock
    # Run as root inside the container so it can access the docker socket.
    # In a real deployment, gate this with a dedicated `docker` group GID.
    user: "0:0"

  # Example subscription pod. Register it in the portal admin UI with
  # pod_name=sub-pod-1, pod_endpoint=http://sub-pod-1:4000.
  sub-pod-1:
    build:
      context: ../pod-runtime
      dockerfile: Dockerfile
    container_name: sub-pod-1
    restart: unless-stopped
    environment:
      PORT: 4000
    volumes:
      # Same workspace bind so /workspaces paths resolve identically across server and pod.
      - ${WORKSPACES_HOST_DIR:-./.workspaces}:/workspaces
    expose:
      - "4000"
    # During smoke-testing without real Anthropic OAuth, override SUB_AUTH_CMD
    # on the *server* side (not here) to point at a stub command that prints sk-ant-oat-...

volumes:
  postgres-data:
